<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Registro</title>
    <link rel="stylesheet" href="jeje.css">
</head>
<body>

    <div class="form-container">
        <h2>Registro de Candidato</h2>
        <form id="registrationForm">
            
            <div class="input-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="input-group">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento" required>
            </div>

            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="correo@ejemplo.com">
            </div>

            <label>Sube tu CV (PDF o DOCX)</label>
            <div id="drop-area">
                <div class="icon">☁️</div>
                <p>Arrastra y suelta tu archivo aquí <br> o</p>
                <button type="button" id="browseBtn">Seleccionar Archivo</button>
                <input type="file" id="fileInput" hidden accept=".pdf,.doc,.docx">
                <p id="file-name"></p>
            </div>

            <button type="submit" class="submit-btn">Enviar Cuestionario</button>
        </form>
    </div>

    <script src="jeje.js"></script>
</body>
</html>
